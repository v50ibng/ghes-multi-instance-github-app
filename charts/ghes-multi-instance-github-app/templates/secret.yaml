{{- if and .Values.credentials.create (not .Values.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ghes-multi-instance-github-app.credentialsSecretName" . }}
  labels:
    {{- include "ghes-multi-instance-github-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.credentials.data }}
  {{- if not $value }}
  {{- fail (printf "credentials.data.%s is required and must be non-empty when credentials.create=true and credentials.existingSecret is empty" $key) }}
  {{- end }}
  {{- printf "%s: %s" $key ($value | quote) | nindent 2 }}
  {{- end }}
{{- end }}
