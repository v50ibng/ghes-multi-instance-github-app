apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ghes-multi-instance-github-app.fullname" . }}-config
  labels:
    {{- include "ghes-multi-instance-github-app.labels" . | nindent 4 }}
data:
  instances.json: |
    {
      "instances": [
        {{- range $index, $instance := .Values.app.instances }}
        {{- if $index }},{{ end }}
        {
          "key": {{ $instance.key | toJson }},
          "name": {{ $instance.name | toJson }},
          "baseUrl": {{ $instance.baseUrl | toJson }},
          "appIdEnv": {{ $instance.appIdEnv | toJson }},
          "privateKeyEnv": {{ $instance.privateKeyEnv | toJson }},
          "webhookSecretEnv": {{ $instance.webhookSecretEnv | toJson }}
        }
        {{- end }}
      ]
    }
